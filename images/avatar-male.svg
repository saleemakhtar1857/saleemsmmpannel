<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
  </defs>
  
  <!-- Outer Ring (Matching Dil SMM Panel Red Accent) -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#dc2626" stroke-width="3" />
  
  <g clip-path="url(#avatarClip)">
    <!-- Light Background -->
    <rect width="120" height="120" fill="url(#bgGrad)" />

    <!-- Red Hoodie / Clothes (Dil SMM Panel Red Hoodie) -->
    <path d="M18 120 C18 90 35 84 60 84 C85 84 102 90 102 120 Z" fill="url(#hoodieGrad)" />
    <!-- Hoodie Hood Behind Head -->
    <path d="M30 65 C22 80 25 102 38 108 C42 98 40 85 40 78 Z" fill="#991b1b" />
    <path d="M90 65 C98 80 95 102 82 108 C78 98 80 85 80 78 Z" fill="#991b1b" />
    <!-- Hoodie V-Neck & Strings -->
    <path d="M48 88 L60 102 L72 88" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M54 96 L53 112 M66 96 L67 112" fill="none" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="52" y="70" width="16" height="18" rx="4" fill="#f8c9a5" />

    <!-- Head / Face -->
    <ellipse cx="60" cy="54" rx="23" ry="26" fill="#fbdcc4" />

    <!-- Ears -->
    <ellipse cx="37" cy="54" rx="4.5" ry="7" fill="#f8c9a5" />
    <ellipse cx="83" cy="54" rx="4.5" ry="7" fill="#f8c9a5" />

    <!-- Spiky Black Hair (Back / Volume) -->
    <path d="M34 50 C32 30 44 14 60 14 C76 14 88 30 86 50 C86 38 78 24 60 24 C42 24 34 38 34 50 Z" fill="#111827" />
    <!-- Spiky Black Hair Front / Bangs -->
    <path d="M34 46 C36 34 46 22 60 22 C74 22 84 34 86 46 C80 38 72 35 66 38 C60 41 58 35 50 36 C42 37 38 42 34 46 Z" fill="#1f2937" />
    <path d="M42 34 L48 44 L45 33 L55 42 L56 31 L64 42 L66 32 L74 44 L72 35" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Eyebrows -->
    <path d="M46 45 Q51 42 56 44" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
    <path d="M64 44 Q69 42 74 45" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />

    <!-- Eyes (Big Animated Expressive Eyes) -->
    <ellipse cx="50" cy="52" rx="4.5" ry="5.5" fill="#111827" />
    <ellipse cx="70" cy="52" rx="4.5" ry="5.5" fill="#111827" />
    <!-- Eye Highlights / Sparkle -->
    <circle cx="48.5" cy="50" r="1.8" fill="#ffffff" />
    <circle cx="51.5" cy="54" r="0.8" fill="#ffffff" />
    <circle cx="68.5" cy="50" r="1.8" fill="#ffffff" />
    <circle cx="71.5" cy="54" r="0.8" fill="#ffffff" />

    <!-- Cute Blush -->
    <ellipse cx="44" cy="58" rx="4" ry="2" fill="#fca5a5" opacity="0.6" />
    <ellipse cx="76" cy="58" rx="4" ry="2" fill="#fca5a5" opacity="0.6" />

    <!-- Nose -->
    <path d="M60 55 Q59 58 60 60" fill="none" stroke="#e09f7a" stroke-width="1.8" stroke-linecap="round" />

    <!-- Friendly Smile -->
    <path d="M54 65 Q60 71 66 65" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
