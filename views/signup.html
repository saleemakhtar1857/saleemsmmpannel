<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up / Register — Saleem SMM Panel</title>
  <meta name="description" content="Create your Saleem SMM Panel account to buy cheap Instagram followers, TikTok views, YouTube watch time and Facebook engagement with EasyPaisa & JazzCash.">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="nightmode" style="min-height:100vh;display:flex;flex-direction:column;">

  <!-- Navigation -->
  <nav class="site-nav">
    <div class="nav-container">
      <a href="../index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-bolt"></i></div>
        <div class="logo-text">Saleem<span>SMM</span></div>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle-btn" onclick="AppState.toggleTheme()" title="Toggle Theme">
          <i class="theme-toggle-icon fa-solid fa-sun"></i>
        </button>
        <a href="../index.html" class="btn-outline">
          <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </nav>

  <!-- Signup Main Container -->
  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:50px 20px;">
    <div class="hero-card" style="max-width:540px;width:100%;margin:0 auto;padding:40px 36px;">
      <div class="login-card-head" style="text-align:center;">
        <div class="logo-badge" style="margin:0 auto 14px;width:50px;height:50px;font-size:24px;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 style="font-size:26px;font-weight:800;margin-bottom:6px;">Create Free Account</h2>
        <p style="font-size:14px;color:var(--text-secondary);">
          Join Saleem SMM Panel today & get <strong style="color:var(--primary);">₨ 100 Signup Bonus</strong> in your wallet!
        </p>
      </div>

      <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="form-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="form-group">
            <label><i class="fa-regular fa-id-badge"></i> Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Ali Khan" required>
          </div>
          <div class="form-group">
            <label><i class="fa-regular fa-user"></i> Username</label>
            <input type="text" id="reg-username" class="form-input" placeholder="e.g. alikhan_pk" required>
          </div>
        </div>

        <div class="form-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="form-group">
            <label><i class="fa-regular fa-envelope"></i> Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="ali@example.com" required>
          </div>
          <div class="form-group">
            <label><i class="fa-brands fa-whatsapp"></i> WhatsApp Number</label>
            <input type="tel" id="reg-phone" class="form-input" placeholder="03001234567" required>
          </div>
        </div>

        <div class="form-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="form-group">
            <label><i class="fa-solid fa-lock"></i> Password</label>
            <input type="password" id="reg-password" class="form-input" placeholder="Min 6 characters" required>
          </div>
          <div class="form-group">
            <label><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter password" required>
          </div>
        </div>

        <div class="form-group" style="margin-top:4px;">
          <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="reg-agree" checked required>
            <span>I agree to the <a href="../index.html#terms" style="color:var(--primary);text-decoration:underline;">Terms of Service</a> & Zero-Tolerance Policy</span>
          </label>
        </div>

        <button type="submit" class="btn-primary-grad btn-block" style="padding:14px;font-size:15px;margin-top:10px;">
          <i class="fa-solid fa-rocket"></i> Register & Claim ₨ 100 Bonus
        </button>
      </form>

      <div style="text-align:center;margin-top:24px;font-size:14px;color:var(--text-secondary);border-top:1px solid var(--border-color);padding-top:18px;">
        Already have an account? 
        <a href="../index.html#auth" style="color:var(--primary);font-weight:700;margin-left:4px;">Log In Here</a>
      </div>
    </div>
  </main>

  <footer style="text-align:center;padding:20px;font-size:13px;color:var(--text-muted);border-top:1px solid var(--border-color);">
    © 2026 Saleem SMM Panel. Pakistan's Wholesale SMM Provider.
  </footer>

  <!-- Scripts -->
  <script src="../js/services-data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;

      if (pass !== confirmPass) {
        AppState.showToast('Passwords do not match! Please check.', 'error');
        return;
      }

      const res = AppState.registerUser(name, username, email, phone, pass);
      if (res.success) {
        AppState.showToast('Welcome to Saleem SMM Panel! ₨ 100 gift credited.', 'success');
        setTimeout(() => {
          if (AppState.isAdmin()) {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 800);
      } else {
        AppState.showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
